[package]
name = "neap-ops"
version = "0.1.0"
description = "Neap ops CLI: key generation, testnet account creation, contract deploy and calls"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
base64 = "0.22"
borsh = "1"
near-crypto = "0.29"
near-primitives = "0.29"
anyhow = "1"
