# Render Blueprint: Neap backend (indexer + API + keeper) and its Postgres.
# Dashboard → New → Blueprint → pick this repo. Then set NEAP_SIGNER_KEY.
services:
  - type: web
    name: neap-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEAP_CONTRACT
        value: neap-perps.testnet
      - key: NEAP_SIGNER
        value: neap-oracle.testnet
      - key: NEAP_SIGNER_KEY
        sync: false # paste the oracle account's private key (ed25519:...) in the dashboard
      - key: FASTNEAR_API_KEY
        sync: false # free key from dashboard.fastnear.com; lifts RPC + neardata rate limits
      - key: NEAP_LOOP_MS
        value: "1000"
      - key: FAUCET_TOKEN
        value: usdc.fakes.testnet
      - key: FAUCET_AMOUNT
        value: "1000000000" # 1,000 test USDC
      - key: RUST_LOG
        value: info,neap_keeper=info
      - key: DATABASE_URL
        fromDatabase:
          name: neap-db
          property: connectionString

databases:
  - name: neap-db
    plan: free
    region: oregon
